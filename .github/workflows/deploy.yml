name: Build and Deploy ToolScout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install Jinja2

      - name: Generate product pages
        run: python scripts/generate_content.py

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.167.0"
          extended: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build website
        run: hugo --source site --destination "${GITHUB_WORKSPACE}/public" --minify --baseURL "https://kimara254.github.io/toolscout/"

      - name: Create plain-text sitemap fallback
        run: |
          python - <<'PYTHON'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("public/sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [
              item.text.strip()
              for item in root.findall("sm:url/sm:loc", ns)
              if item.text and item.text.strip()
          ]
          if not urls:
              raise SystemExit("No sitemap URLs found")
          Path("public/sitemap.txt").write_text(
              "\n".join(urls) + "\n", encoding="utf-8"
          )
          print(f"Created text sitemap with {len(urls)} URLs")
          PYTHON

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
